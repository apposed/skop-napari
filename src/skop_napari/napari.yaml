name: skop-napari
display_name: scikit-ops

# NB: two widgets, and the second is deliberate. napari nests a plugin's
# widgets under its own name only when the plugin contributes more than one --
# with a single widget the entry sits flat as "scikit-ops: Ops". So this is
# what produces Plugins > scikit-ops > {Ops, Workflows}.
#
# Neither entry names an op. A per-workflow menu item would mean this manifest
# holding function names that live in the other repository, where a rename
# would silently break the menu; the workflow is chosen inside the panel
# instead, from whatever discovery finds.
contributions:
  commands:
    - id: skop-napari.ops_panel
      title: Ops
      python_name: skop_napari._panel:OpsPanel
    - id: skop-napari.workflows_panel
      title: Workflows
      python_name: skop_napari._panel:WorkflowsPanel
  widgets:
    - command: skop-napari.ops_panel
      display_name: Ops
    - command: skop-napari.workflows_panel
      display_name: Workflows
